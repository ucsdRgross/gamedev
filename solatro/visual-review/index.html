<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visual review</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #222; color: #ddd; font: 14px system-ui, sans-serif; }
  #pair { flex: 1; min-height: 0; display: flex; gap: 4px; padding: 4px; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .side h2 { margin: 0 0 2px; font-size: 12px; color: #999; }
  .frame { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #111; }
  .frame img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .none { color: #777; }
  #crops { display: flex; gap: 12px; padding: 4px; overflow-x: auto; }
  #crops:empty { display: none; }
  .crop h3 { margin: 0 0 2px; font-size: 12px; font-weight: normal; }
  .crop canvas { height: 160px; margin-right: 4px; background: #111; image-rendering: pixelated; }
  #panel { padding: 6px 8px; border-top: 1px solid #444; }
  #seen { margin: 4px 0; max-height: 72px; overflow: auto; }
  #comment { width: 100%; box-sizing: border-box; height: 38px; background: #111; color: #ddd; border: 1px solid #555; }
  .approve { color: #7c7; } .reject { color: #e77; } .comment { color: #ec7; } .stale { color: #888; }
</style>
</head>
<body>
<div id="pair">
  <div class="side"><h2>BEFORE (base)</h2><div class="frame" id="before"></div></div>
  <div class="side"><h2>AFTER (this work)</h2><div class="frame" id="after"></div></div>
</div>
<div id="crops"></div>
<div id="panel">
  <div><b id="counter"></b> <b id="title"></b> <span id="row"></span> <span id="verdict"></span></div>
  <div id="seen"></div>
  <textarea id="comment" placeholder="comment (c to type, Enter saves, Esc leaves)"></textarea>
  <div>
    <button id="approve">(a) Approve</button>
    <button id="reject">(r) Reject</button>
    <button id="save">(⏎) Save comment</button>
    <button id="prev">(←) Prev</button>
    <button id="next">(→) Next</button>
    <button id="done">Done</button>
    <span id="status"></span>
  </div>
</div>
<script>
const project = location.pathname.split('/')[2];
const api = `/api/visual-review/${project}`;
let data = null;
let at = 0;

const $ = (id) => document.getElementById(id);

function imageSrc(side, shot) {
  return `/visual-review/${project}/${side}/${shot.id}.png?t=${encodeURIComponent(data.files[shot.id][side])}`;
}

function cropCanvas(side, shot, crop) {
  const canvas = document.createElement('canvas');
  canvas.width = crop.w;
  canvas.height = crop.h;
  canvas.title = side;
  const img = new Image();
  img.onload = () => canvas.getContext('2d').drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, crop.w, crop.h);
  img.src = imageSrc(side, shot);
  return canvas;
}

function crops(shot) {
  $('crops').replaceChildren();
  for (const crop of shot.crops || []) {
    const box = document.createElement('div');
    box.className = 'crop';
    const label = document.createElement('h3');
    label.textContent = crop.label;
    box.append(label);
    for (const side of ['before', 'after']) {
      if (data.files[shot.id][side]) box.append(cropCanvas(side, shot, crop));
    }
    $('crops').append(box);
  }
}

function image(side, shot) {
  const frame = $(side);
  const written = data.files[shot.id][side];
  if (!written) {
    frame.innerHTML = `<span class="none">no ${side}</span>`;
    return;
  }
  const src = imageSrc(side, shot);
  frame.innerHTML = `<a href="${src}" target="_blank"><img src="${src}" alt="${side}"></a>`;
}

function show() {
  const shot = data.manifest.shots[at];
  const given = data.review.shots[shot.id];
  image('before', shot);
  image('after', shot);
  crops(shot);
  $('counter').textContent = `${at + 1} / ${data.manifest.shots.length}`;
  $('title').textContent = shot.title;
  $('row').textContent = shot.row;
  $('seen').textContent = `Worker saw: ${shot.seen}`;
  $('comment').value = given ? given.comment : '';
  const stale = given && data.files[shot.id].after > given.at;
  $('verdict').className = given ? (stale ? 'stale' : given.verdict) : '';
  $('verdict').textContent = given ? `${given.verdict}${stale ? ' (given on an older after)' : ''}` : '';
}

async function load() {
  data = await fetch(api).then((r) => r.json());
  show();
}

async function give(verdict) {
  const shot = data.manifest.shots[at];
  const res = await fetch(`${api}/verdict`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: shot.id, verdict, comment: $('comment').value }),
  });
  if (!res.ok) {
    $('status').textContent = `not saved: ${(await res.json()).error}`;
    return;
  }
  $('status').textContent = `${shot.id}: ${verdict} saved`;
  $('comment').blur();
  data.review = (await res.json()).review;
  at = Math.min(at + 1, data.manifest.shots.length - 1);
  show();
}

function move(by) {
  at = (at + by + data.manifest.shots.length) % data.manifest.shots.length;
  show();
}

async function done() {
  const res = await fetch(`${api}/done`, { method: 'POST' });
  $('status').textContent = res.ok ? 'Done - handed back to the worker' : 'Done failed';
}

$('approve').onclick = () => give('approve');
$('reject').onclick = () => give('reject');
$('save').onclick = () => give('comment');
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('done').onclick = done;

document.addEventListener('keydown', (e) => {
  if (e.target === $('comment')) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); give('comment'); }
    if (e.key === 'Escape') $('comment').blur();
    return;
  }
  const keys = {
    a: () => give('approve'), r: () => give('reject'),
    ArrowLeft: () => move(-1), ArrowRight: () => move(1), c: () => $('comment').focus(),
  };
  if (!keys[e.key]) return;
  e.preventDefault();
  keys[e.key]();
});

load();
</script>
</body>
</html>
